# Example QC-and-Predictions pipeline config. Copy to {name}_pipeline_config.yaml
# and fill in real values -- that file is gitignored (real paths/synIDs never committed).
#
# Supports clusters from multiple datasets in a single run (see the design plan's
# "Multi-dataset support" section) -- `clusters` is nested by dataset. Everything
# else here is global, applied identically across every dataset in this run.

scE2G_dir: /oak/stanford/groups/engreitz/Users/kaybrand/scE2G_preprint/scE2G
gtf: /oak/stanford/groups/engreitz/Projects/IGVF-E2GPillarProject/uniformly_processed/GENCODEv43/IGVFFI9573KOZR.gtf.gz
# The QC-guide INPUT root: {data_dir}/plots, {data_dir}/datatables -- pre-existing
# QC-guide plots/QC-threshold plots and per-cell-QC datatables this pipeline READS
# from, never writes to (2026-08-15: filtered ATAC/RNA/index outputs moved to
# output_dir below -- data_dir is now single-purpose). Set once, independently of
# wherever this pipeline's own code happens to be checked out (WDIR) -- a
# worktree/branch checkout of this repo's code is not the same thing as the data
# location, and code-directory-relative datafile paths silently break the moment
# those two diverge (see common.smk/resolve_exclusions.py's own docstrings,
# 2026-08-03).
data_dir: /oak/stanford/groups/engreitz/Projects/IGVF-E2GPillarProject/QC_pseudobulks
# OPTIONAL. Where {dataset}_data/{cluster}_per_cell_qc.tsv lives. Defaults to
# {data_dir}/datatables, and is read ONLY for clusters marked `prefiltered: true`
# (see the clusters: block below), so most configs never need it. Point it at a
# tree rebuilt by workflow/scripts/build_qc_datatables.py from portal-downloaded
# pseudobulks -- e.g. {output_dir}/QC_datatables -- to stop depending on the
# legacy hand-made tables under the read-only data_dir.
# qc_datatables_dir: ./results/QC_datatables
# Consolidated OUTPUT root for everything this pipeline WRITES: filtered ATAC/RNA
# outputs ({output_dir}/multiome_data/...), scE2G's own predictions/candidates/
# features/QC-plots/bigwigs/bedpe tree ({output_dir}/uniformly_processed/...),
# cluster-stats tables, Synapse manifests, and the coverage report. Relative paths
# (like the default below) resolve against the repo root (the directory containing
# this repo's own workflow/), not against data_dir and not against the current
# working directory -- see workflow/scripts/pipeline_paths.py.
output_dir: ./results
# pseudobulks_dir for a given dataset = {pseudobulks_root}/{dataset}/pseudobulks -- always
# the archive-extracted root (one-time-per-dataset sbatch job, per the
# qc-filter-pseudobulks skill), even for igvf0/igvf1: the sbaek1 pseudobulk directory
# only has real data for those two datasets and 0-byte placeholders for everything
# else, so standardizing avoids a dataset-dependent branch.
pseudobulks_root: /scratch/users/kaybrand/pseudobulk/igvf
scE2G_version: "1.2"

# Shared with manage_igvf_metadata.py (the IGVF metadata uploader) -- see
# igvf_metadata/context.py's IgvfConfig for lab/award/alias_prefix/enabled_families
# defaults, all overridable here. state_db_path points reformat.smk's own
# SampleTermID/SampleSummaryShort sourcing (workflow/rules/reformat.smk) at the
# same cell-metadata cache manage_igvf_metadata.py populates -- required once this
# pipeline reformats any E2G prediction Tabular Files for IGVF Portal submission.
igvf:
  state_db_path: /oak/stanford/groups/engreitz/Projects/IGVF-E2GPillarProject/QC_pseudobulks-igvf-portal-submission/resources/igvf_metadata_state.db

# Passed through into scE2G's own config/config.yaml, identically for every dataset in
# this run. Every key scE2G supports under its OPTIONS / REFERENCE FILES / WORKFLOW
# PARAMS sections is reachable here (see scE2G_dir/config/config.yaml for the full
# default set) -- anything omitted here just falls back to scE2G's own default.
scE2G_options:
  max_cell_count: 20000
  make_IGV_tracks: true
  # Standardized genome reference used by all other scE2G runs on pseudobulk data --
  # keep consistent with that convention rather than scE2G's own intGENCODEv43 default.
  gene_TSS500: resources/genome_annotations/CollapsedGeneBound.hg38.GENCODEv43GeneSymbol.TSS500bp.bed
  genes: resources/genome_annotations/CollapsedGeneBound.hg38.GENCODEv43GeneSymbol.bed

exclusion:
  # "{dataset}/{cluster}" strings, not bare cluster names -- cluster names aren't
  # guaranteed unique across datasets, so exclusion entries must be dataset-qualified.
  user_specified: []
  process_excluded_no_upload: false # true => run the pipeline for excluded clusters, skip all Synapse steps for them
  auto_thresholds:
    min_cell_count: 100
    min_fragments_total: 2000000
    min_umi_count: 1000000
    # cell_count/fragments_total/umi_count are computed at Snakemake parse time
    # (workflow/scripts/resolve_exclusions.py), from the QC guide and either the
    # pre-existing filtered_cell_subsample_metrics.tsv or a merged per-cell-QC
    # table -- NOT from scE2G's own qc_plots/all_qc_stats.tsv, which doesn't
    # exist until scE2G has already run for that cluster. Any cluster whose
    # computed stats fall below these thresholds is excluded for this run, in
    # addition to `user_specified`. umi_count is skipped for ATAC-only clusters.
    # Because this happens at parse time, excluded clusters never get a single
    # rule instantiated for them, unless `process_excluded_no_upload` is set.

synapse:
  dry_run: true             # default; upload steps never push for real until explicitly disabled
  confirm_delete: false     # default; stale/excluded entity deletion always requires explicit opt-in
  confirm_overwrite: false  # default; overwriting an EXISTING entity in the shared "Multiome datasets" folder requires explicit opt-in
  filtered_data_parent_id: syn53469844   # "Multiome datasets" -- not collaborative, {dataset}/{cluster}/{file}
  predictions_parent_id: syn53469845     # collaborative (~10 models' files coexist); {dataset}/{cluster}/{file}
  candidates_parent_id: syn75065641      # not collaborative; flat, no {dataset}/{cluster} nesting
  features_parent_id: syn75936892        # collaborative; {dataset}/{cluster}/{file}

# Nested by dataset -- one scE2G module instance (partitioned cell_clusters table +
# results_dir) gets generated per distinct top-level key here, whether that's 3
# datasets with 1 cluster each or 1 dataset with 500 clusters.
clusters:
  igvf10:
    telohaec_crispri:
      pseudobulk_annotation: telohaec_crispri  # pseudobulk annotation dir name (--cell-type for filter_*.py)
      qc_guide: /oak/stanford/groups/engreitz/Projects/IGVF-E2GPillarProject/QC_pseudobulks/plots/igvf10/telohaec_crispri/filtered_barcodes_with_subsamples.tsv.gz
      models: [multiome_powerlaw_v3, scATAC_powerlaw_v3]
  # igvf17:
  #   example_atac_only_cluster:
  #     pseudobulk_annotation: some_annotation_dir
  #     qc_guide: /oak/.../plots/igvf17/example_atac_only_cluster/QC_filtered_excluding_BAD_SUBSAMPLE.tsv.gz
  #     models: [scATAC_powerlaw_v3]   # RNA matrix never generated for this cluster
  # ATAC-only VARIANT of an otherwise-real cluster (RNA quality too poor for
  # predictions, e.g. pancreatic_delta_d32_ATAC_only): cluster key carries the
  # _ATAC_only suffix (drives file names/output paths/report rows), but
  # pseudobulk_annotation stays the bare raw-directory name, and
  # cell_annotation_key points reformat at the base name's real portal
  # CellAnnotation/SampleTermID/SampleTermName (the suffixed name has none).
  # igvf_manifest_excluded keeps it out of any --cluster-keys list built for
  # manage_igvf_metadata.py, even though it's reformat-eligible.
  # igvf6:
  #   pancreatic_delta_d32_ATAC_only:
  #     pseudobulk_annotation: pancreatic_delta_d32
  #     qc_guide: /oak/.../plots/igvf6/pancreatic_delta_d32/filtered_barcodes_with_subsamples.tsv.gz
  #     models: [scATAC_powerlaw_v3]
  #     cell_annotation_key: pancreatic_delta_d32
  #     igvf_manifest_excluded: true
  #
  # prefiltered: OPTIONAL, default false. Chooses where the quality gate
  # (resolve_exclusions.py) reads this cluster's cell_count/fragments_total/
  # umi_count from. Leave it unset for every normal cluster.
  #
  #   unset/false -- read plots/{dataset}/{cluster}/
  #                  filtered_cell_subsample_metrics.tsv, the POST-filter
  #                  aggregate plot_per_cell_qc.R writes next to the QC guide.
  #                  If it is missing the cluster is excluded with reason
  #                  "missing_metrics" -- deliberately NOT falling back to
  #                  unfiltered numbers.
  #   true        -- this cluster's barcodes were filtered upstream and no
  #                  plot_per_cell_qc.R metrics file exists, so derive depth by
  #                  joining the guide's barcodes against the UNFILTERED
  #                  {qc_datatables_dir}/{dataset}_data/{cluster}_per_cell_qc.tsv.
  #
  # The gate decides what gets predicted on and shared, so it must see
  # post-filter depth; the datatable holds every cell pre-QC and is only
  # comparable after that join. Setting this flag when a metrics file could
  # exist instead silently changes what the thresholds mean.
  #
  # A MERGED cluster is the usual reason to need it -- plot_per_cell_qc.R runs
  # per component, so no metrics file exists under the merged name. Preferred
  # fix is to build one with workflow/scripts/merge_cluster_metrics.py and leave
  # this flag off; that reproduces the same three numbers and survives config
  # regeneration, which a hand-added flag in a generated block does not.
  # igvf18:
  #   mcf7:
  #     pseudobulk_annotation: mcf7_1,mcf7_2
  #     qc_guide: /oak/.../plots/igvf18/mcf7/filtered_barcodes_with_subsamples.tsv.gz
  #     models: [multiome_powerlaw_v3, scATAC_powerlaw_v3]
  #     prefiltered: true
